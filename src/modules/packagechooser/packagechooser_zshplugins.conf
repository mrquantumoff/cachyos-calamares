# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# qdrnt: oh-my-zsh plugins for the new user's ~/.zshrc (read by qdrnt-setup
# from global storage key packagechooser_zshplugins, comma-separated ids).
# zsh-autosuggestions and zsh-syntax-highlighting are always enabled.
---
mode: optionalmultiple

method: legacy

labels:
    step: "Zsh plugins"

default:
    - git
    - sudo
    - history-substring-search
    - command-not-found
    - fzf
    - extract
    - colored-man-pages
    - copypath
    - copyfile
    - copybuffer
    - dirhistory
    - archlinux
    - systemd
    - docker
    - docker-compose
    - aliases

items:
    - id: git
      name: "git"
      description: "Git aliases (gst, gco, gp, ...) and branch info in the prompt."

    - id: sudo
      name: "sudo"
      description: "Press Esc twice to put sudo in front of the current or last command."

    - id: history-substring-search
      name: "history-substring-search"
      description: "Type part of a command, then Up/Down to search history for it."

    - id: command-not-found
      name: "command-not-found"
      description: "Suggests the package that provides an unknown command (pkgfile)."

    - id: fzf
      name: "fzf"
      description: "Fuzzy finder: Ctrl-R history, Ctrl-T files, Alt-C directories."

    - id: extract
      name: "extract"
      description: "`x <archive>` extracts any archive type."

    - id: colored-man-pages
      name: "colored-man-pages"
      description: "Adds colors to man pages."

    - id: copypath
      name: "copypath"
      description: "`copypath` copies the current directory (or a path) to the clipboard."

    - id: copyfile
      name: "copyfile"
      description: "`copyfile <file>` copies a file's contents to the clipboard."

    - id: copybuffer
      name: "copybuffer"
      description: "Ctrl-O copies the current command line to the clipboard."

    - id: dirhistory
      name: "dirhistory"
      description: "Alt-Left/Right/Up to move back, forward and up through directories."

    - id: archlinux
      name: "archlinux"
      description: "Aliases for pacman and AUR helpers (pacupg, pacin, paruupg, ...)."

    - id: systemd
      name: "systemd"
      description: "systemctl aliases (sc-status, sc-restart, scu-* for user units, ...)."

    - id: docker
      name: "docker"
      description: "Docker completion and aliases (dps, dex, dlo, ...)."

    - id: docker-compose
      name: "docker-compose"
      description: "docker compose aliases (dcup, dcdn, dclf, ...)."

    - id: aliases
      name: "aliases"
      description: "`als` lists and searches all defined aliases."

    - id: z
      name: "z"
      description: "`z <dir>` jumps to frequently used directories (pure zsh, no extra tools)."

    - id: web-search
      name: "web-search"
      description: "`google`, `ddg`, `github` ... search the web from the terminal."

    - id: jsontools
      name: "jsontools"
      description: "pp_json, is_json, urlencode_json and friends."

    - id: encode64
      name: "encode64"
      description: "`e64` / `d64` base64 encode and decode."

    - id: rsync
      name: "rsync"
      description: "rsync aliases (rsync-copy, rsync-move, rsync-update, rsync-synchronize)."

    - id: ssh-agent
      name: "ssh-agent"
      description: "Starts ssh-agent automatically and loads your keys."

    - id: gh
      name: "gh"
      description: "Completion for the GitHub CLI."

    - id: rust
      name: "rust"
      description: "Completion for rustc, rustup and cargo."

    - id: npm
      name: "npm"
      description: "npm completion and aliases."

    - id: python
      name: "python"
      description: "Python aliases (py, pyfind, pyclean, mkv/vrun for virtualenvs)."

    - id: kubectl
      name: "kubectl"
      description: "kubectl completion and aliases (k, kgp, kaf, ...)."

    - id: timer
      name: "timer"
      description: "Shows how long each command took."

    - id: vi-mode
      name: "vi-mode"
      description: "Vi key bindings on the command line."

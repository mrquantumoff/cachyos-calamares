#
# qdrnt post-install: docker, CUDA on NVIDIA, Flathub, Helium as default browser,
# and the Easy Anti-Cheat boot entry (qdrnt-eac, after chwd and the bootloader).
---
dontChroot: false
timeout: 3600
script:
    # Single quotes: if the key is missing the literal stays harmless (qdrnt-setup ignores it).
    - command: "/etc/calamares/scripts/qdrnt-setup ${USER} '${gs[packagechooser_zshplugins]}'"
      timeout: 3600
    - command: "/etc/calamares/scripts/qdrnt-eac '${gs[packagechooser_bootloader]}'"
      timeout: 1800
    - "-rm /etc/calamares/scripts/qdrnt-setup"
    - "-rm /etc/calamares/scripts/qdrnt-eac"
    - "-rm /etc/calamares/scripts/qdrnt.zsh"
i18n:
    name: "Applying qdrnt configuration"
